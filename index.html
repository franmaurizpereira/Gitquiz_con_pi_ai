<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitQuiz - Quiz de Git para Principiantes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>GitQuiz</h1>
            <p>Prueba tus conocimientos sobre Git</p>
        </header>

        <section class="quiz-section" id="quiz-section">
            <!-- Número de pregunta y barra de progreso -->
            <div class="progreso">
                <span id="progreso">1 de 20</span>
                <div class="barra-progreso">
                    <div class="progreso-actual" id="barra-progreso"></div>
                </div>
            </div>

            <!-- Enunciado de la pregunta actual -->
            <h2 class="pregunta" id="pregunta">Cargando pregunta...</h2>

            <!-- Aquí JavaScript inserta los 4 botones de opción -->
            <div class="opciones" id="opciones"></div>

            <!-- Explicación que aparece tras responder -->
            <p class="explicacion" id="explicacion" hidden></p>

            <!-- Botón para avanzar -->
            <button class="btn-siguiente" id="siguiente" disabled>Responder</button>
        </section>

        <footer>
            <p>Quiz educativo sobre Git para aprendices</p>
        </footer>
    </main>

    <!-- quiz.js debe cargarse ANTES que app.js (define quizData) -->
    <script src="quiz.js"></script>
    <script src="app.js"></script>
</body>
</html>
